[server]
maxUploadSize = 1024
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Cockpit: slate-blue stage, light type, frosted glass. See core/ui.py and the design doc.
[theme]
base = "dark"
primaryColor = "#F4F8FA"
backgroundColor = "#1B262D"
secondaryBackgroundColor = "#2D404C"
textColor = "#EEF3F6"
linkColor = "#F4F8FA"
borderColor = "rgba(255,255,255,0.11)"
dataframeBorderColor = "rgba(255,255,255,0.08)"
dataframeHeaderBackgroundColor = "#24343E"
greenColor = "#5CC9A7"
redColor = "#E06A78"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&display=swap"
headingFontWeights = [300, 300, 400]
headingFontSizes = ["2.6rem", "1.6rem", "1.2rem"]
baseRadius = "14px"
buttonRadius = "999px"
chartCategoricalColors = ["#F4F8FA", "#5CC9A7", "#E06A78", "#E2B867", "#8FA8FF", "#9AABB6"]

[theme.sidebar]
backgroundColor = "#1B262D"
secondaryBackgroundColor = "#2D404C"
